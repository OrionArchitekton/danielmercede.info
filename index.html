  <script type="application/ld+json">

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font CSS after the parser-blocking Tailwind script so a slow fonts.googleapis.com
       response cannot serialize ahead of (block) Tailwind execution; preconnects above
       still warm the connection. display=swap avoids invisible-text on the font fetch. -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f9fafb;
    }

    /* a11y: honor reduced-motion requests (parity with the hub a11y pass). */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

}
