<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Resource hints: Google Fonts origins (React/react-dom are bundled by Vite, not
       externalized to esm.sh, so the production page never fetches from esm.sh, no
       esm.sh hint here). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Basic SEO -->

  <link rel="canonical" href="https://www.danielmercede.info/" />

  <!-- Open Graph -->
  <meta property="og:type" content="profile" />
  <meta property="og:site_name" content="Daniel Mercede" />
  <meta property="og:title" content="Daniel “Dan” Mercede: Professional Identity" />
  <meta property="og:description"
    content="Professional identity reference for Daniel “Dan” Mercede, founder, operator, and systems builder." />
  <meta property="og:url" content="https://www.danielmercede.info/" />
  <meta property="og:image" content="https://www.danielmercede.info/dan-mercede-og-card.jpg" />

  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Daniel Mercede, founder, operator, and systems builder" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@danmercede" />
  <meta name="twitter:creator" content="@danmercede" />
  <meta name="twitter:title" content="Daniel “Dan” Mercede: Professional Identity" />
  <meta name="twitter:description" content="Professional identity reference for Daniel “Dan” Mercede, founder, operator, and systems builder." />
  <meta name="twitter:image" content="https://www.danielmercede.info/dan-mercede-og-card.jpg" />
  <meta name="twitter:image:alt" content="Daniel Mercede, founder, operator, and systems builder" />


  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="icon" href="/favicon.ico">
  <meta name="theme-color" content="#f9fafb" />

  <!-- JSON-LD: WebPage/WebSite backlinking identity to the hub Person
       (danmercede.com/#person); no local Person node, per the hub-spoke rule. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["ProfilePage", "WebPage"],
          "@id": "https://www.danielmercede.info/#webpage",
          "url": "https://www.danielmercede.info/",
          "name": "Daniel “Dan” Mercede: Professional Identity",
          "mainEntity": { "@id": "https://www.danmercede.com/#person" },
          "about": { "@id": "https://www.danmercede.com/#person" },
          "isPartOf": { "@id": "https://www.danielmercede.info/#website" }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.danielmercede.info/#website",
          "url": "https://www.danielmercede.info/",
          "publisher": { "@id": "https://www.danmercede.com/#person" }
        }
      ]
    }
    </script>

  <!-- Tailwind is bundled at build time (compiled stylesheet emitted by Vite);
       the render-blocking Tailwind CDN JIT compiler and the base <style> have
       moved to tailwind.config.js + index.css. Font CSS is non-blocking
       (preconnect above warms the origin; display=swap avoids invisible text). -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" />
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
